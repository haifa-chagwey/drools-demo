services:
  postgres:
    container_name: ms_pg_sql
    image: postgres
    environment:
      POSTGRES_USER: haifa
      POSTGRES_PASSWORD: haifa
      PDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rule-engine-net
    restart: unless-stopped

  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5050:80
    networks:
      - rule-engine-net
    restart: unless-stopped

  drools-workbench:
    container_name: drools-workbench
    image: jboss/business-central-workbench-showcase:latest
    ports:
      - "8082:8080"
      - "8001:8001"
    networks:
      - rule-engine-net
    restart: unless-stopped

  kie-server:
    container_name: kie-server
    image: jboss/kie-server-showcase:latest
    environment:
      - KIE_MAVEN_REPO=http://drools-workbench:8080/business-central/maven2
      - KIE_SERVER_CONTROLLER=http://drools-workbench:8080/business-central/rest/controller
    ports:
      - "8180:8080"
    depends_on:
      - drools-workbench
    networks:
      - rule-engine-net
    restart: unless-stopped



networks:
  rule-engine-net:
    driver: bridge

volumes:
  postgres:
  pgadmin: